name: 'Build & Test'

on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: voidzero-dev/setup-vp@v1.21.2
      with:
        node-version-file: '.nvmrc'
        cache: true
    - run: npm run compile
    - run: npm run test
